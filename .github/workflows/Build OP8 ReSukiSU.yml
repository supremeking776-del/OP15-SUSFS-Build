name: Build OP8 ReSukiSU
# Custom kernel for OnePlus 8 (instantnoodle / IN2013 / EX01) -> 4.19.157-perf+
# ReSukiSU + SUSFS, manual hook (scope-minimized 4.19), AnyKernel3 zip + boot.img

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        type: choice
        description: "Device variant"
        required: true
        default: instantnoodle
        options:
          - instantnoodle
          - instantnoodlep
          - kebab
      SOURCE_REPO:
        type: string
        description: "Kernel source repo (owner/repo)"
        required: true
        default: "OnePlusOSS/android_kernel_oneplus_sm8250"
      SOURCE_BRANCH:
        type: choice
        description: "Source branch"
        required: true
        default: oneplus/sm8250_t_13.0.0_op8
        options:
          - oneplus/sm8250_t_13.0.0_op8
          - oneplus/SM8250_S_12.0.0_op8
      KSU_BRANCH:
        type: choice
        description: "ReSukiSU branch"
        required: true
        default: susfs-main
        options:
          - susfs-main
          - main
          - non-gki
      ENABLE_SUSFS:
        type: boolean
        description: "Enable SUSFS"
        required: true
        default: true
      HOOK_MODE:
        type: choice
        description: "KSU hook mode (4.19 must use manual)"
        required: true
        default: manual
        options:
          - manual
          - susfs_inline
      KERNEL_LOCALVERSION:
        type: string
        description: "CONFIG_LOCALVERSION value (final string will be 4.19.157<this>)"
        required: true
        default: "-perf+"
      CUSTOM_TAG:
        type: string
        description: "Optional tag to add to artifact filename"
        required: false
        default: "ReSukiSU-OP8-IN2013"
      STOCK_BOOT_URL:
        type: string
        description: "Optional URL to stock boot.img for repacking (leave empty to synthesize)"
        required: false
        default: ""

env:
  TZ: UTC
  KBUILD_BUILD_USER: ReSukiSU
  KBUILD_BUILD_HOST: github

jobs:
  build:
    name: Build ${{ inputs.DEVICE }} 4.19.157${{ inputs.KERNEL_LOCALVERSION }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout this repo (for patches/anykernel)
        uses: actions/checkout@v4
        with:
          path: workflow_repo

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libelf-dev liblz4-tool libssl-dev libxml2-utils lzop \
            python3 python3-pip python-is-python3 zip cpio rsync \
            kmod libncurses-dev pkg-config xz-utils wiggle patchutils

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: op8-${{ inputs.DEVICE }}-${{ inputs.SOURCE_BRANCH }}
          max-size: 2G

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ inputs.SOURCE_BRANCH }}" \
            "https://github.com/${{ inputs.SOURCE_REPO }}.git" kernel
          cd kernel
          echo "Kernel head: $(git rev-parse --short HEAD)"
          # confirm Makefile carries 4.19.x
          head -n5 Makefile

      - name: Clone toolchain (AOSP clang + GCC 4.9)
        run: |
          mkdir -p tc
          git clone --depth=1 -b master-kernel-build-2022 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 tc/clang
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 tc/gcc64
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 tc/gcc32
          # pick the highest clang-rXXXXXX directory available
          CLANG_DIR=$(ls -d tc/clang/clang-r* | sort -V | tail -n1)
          echo "CLANG_DIR=$CLANG_DIR"
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV

      - name: Integrate ReSukiSU (KSU driver)
        working-directory: kernel
        run: |
          curl -fsSL https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            -o /tmp/resukisu_setup.sh
          chmod +x /tmp/resukisu_setup.sh
          /tmp/resukisu_setup.sh "${{ inputs.KSU_BRANCH }}"
          ls -ld KernelSU drivers/kernelsu

      - name: Apply ReSukiSU 4.19 scope-minimized hook patch
        if: ${{ inputs.HOOK_MODE == 'manual' }}
        working-directory: kernel
        run: |
          curl -fsSL -o /tmp/kernel-4.19.patch \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU_Patches/main/scope-minimized/kernel-4.19.patch

          # Apply with extra fuzz; tolerate per-hunk failures (vendor diffs in OnePlus CAF)
          set +e
          patch -p1 -F5 --no-backup-if-mismatch -r /tmp/patch.rej \
            < /tmp/kernel-4.19.patch | tee /tmp/patch.out
          PATCH_RC=$?
          set -e

          # Manual fallback for kernel/reboot.c (vendor adds check_poweroff_charger_mode)
          if ! grep -q 'ksu_handle_sys_reboot' kernel/reboot.c; then
            echo "[!] Injecting reboot hook manually"
            python3 "$GITHUB_WORKSPACE/workflow_repo/patches/op8/inject_reboot_hook.py"
          fi

          # Sanity: confirm the four critical hooks are wired
          for sym in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_sys_reboot; do
            if ! grep -rqE "$sym" fs/exec.c fs/open.c fs/stat.c kernel/reboot.c 2>/dev/null; then
              echo "::error::Hook $sym missing after patch"; exit 1
            fi
          done
          echo "[+] All scope-minimized hooks present"

      - name: Apply SUSFS patches (kernel-4.19)
        if: ${{ inputs.ENABLE_SUSFS == true }}
        run: |
          git clone --depth=1 -b kernel-4.19 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs
          cd kernel
          cp -v ../susfs/kernel_patches/fs/* fs/
          cp -v ../susfs/kernel_patches/include/linux/* include/linux/

          # Apply with high fuzz, tolerate per-hunk failures (vendor diffs in OnePlus CAF)
          set +e
          patch -p1 -F10 --no-backup-if-mismatch \
            < ../susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch \
            > /tmp/susfs_patch.log 2>&1
          set -e
          tail -n 40 /tmp/susfs_patch.log

          # Auto-merge any rejected hunks with wiggle
          REJECTS=$(find . -name '*.rej' -type f)
          if [ -n "$REJECTS" ]; then
            echo "::group::Wiggle merge of rejected hunks"
            FAILED=0
            for rej in $REJECTS; do
              src="${rej%.rej}"
              echo "wiggle merge: $src"
              if wiggle --replace --merge "$src" "$rej"; then
                rm -f "$rej" "${src}.porig"
                echo "  -> merged"
              else
                FAILED=1
                echo "::warning::wiggle could NOT auto-merge $src (kept .rej for manual inspection)"
                cat "$rej"
              fi
            done
            echo "::endgroup::"
            if [ "$FAILED" -ne 0 ]; then
              echo "::warning::Some SUSFS hunks remain unresolved; the build step will surface any compile errors."
            fi
          fi

          # Apply susfs->KernelSU integration patch (already tolerant)
          (cd KernelSU && patch -p1 -F5 --no-backup-if-mismatch \
            < ../../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch) || true

          echo "[+] SUSFS (kernel-4.19) integration done"

      - name: Apply repo-level extra patches (if any)
        working-directory: kernel
        run: |
          if [ -d "$GITHUB_WORKSPACE/workflow_repo/patches/op8" ]; then
            for p in "$GITHUB_WORKSPACE/workflow_repo/patches/op8/"*.patch; do
              [ -f "$p" ] || continue
              echo "Applying $p"
              patch -p1 --no-backup-if-mismatch < "$p" || true
            done
          fi

      - name: Patch Python 2 scripts to Python 3
        working-directory: kernel
        run: |
          sudo apt-get install -y --no-install-recommends 2to3 || true
          if [ -f scripts/gcc-wrapper.py ]; then
            2to3 -w -n -W scripts/gcc-wrapper.py || true
          fi
          find scripts -maxdepth 2 -name '*.py' -print0 | while IFS= read -r -d '' f; do
            if grep -Eq '^[[:space:]]*print[[:space:]]+["'\'']' "$f" 2>/dev/null; then
              2to3 -w -n -W "$f" || true
            fi
          done
          echo "[+] Python 2 -> 3 conversion done"

      - name: Stub missing Kconfig source references (OPlus public-source gaps)
        working-directory: kernel
        run: |
          # OnePlus's public source tree references some OPlus-internal Kconfig
          # files that are not shipped (e.g. kernel/sched_assist/Kconfig).
          # Walk all source "..." statements, and if the file is missing,
          # create an empty Kconfig stub at that path.
          STUBBED=0
          # find any 'source "..."' or "source '...'" reference in Kconfig files
          while IFS= read -r line; do
            kf=$(echo "$line" | sed -E 's/.*source[[:space:]]+["'\'']([^"'\'' ]+)["'\''].*/\1/')
            [ -z "$kf" ] && continue
            [ -f "$kf" ] && continue
            mkdir -p "$(dirname "$kf")"
            : > "$kf"
            echo "  stubbed: $kf"
            STUBBED=$((STUBBED+1))
          done < <(grep -RhE '^[[:space:]]*source[[:space:]]+["'\'']' --include=Kconfig\* . 2>/dev/null)
          echo "[+] Stubbed $STUBBED missing Kconfig source(s)"

      - name: Configure defconfig (KSU + SUSFS + version)
        working-directory: kernel
        run: |
          # OP8 family (instantnoodle/instantnoodlep/kebab) all use SoC-level
          # vendor/kona-perf_defconfig in OOS12/OOS13. Older sources may have
          # per-device defconfigs, so try those first.
          CANDIDATES=(
            "arch/arm64/configs/vendor/${{ inputs.DEVICE }}_defconfig"
            "arch/arm64/configs/${{ inputs.DEVICE }}_defconfig"
            "arch/arm64/configs/vendor/kona-perf_defconfig"
            "arch/arm64/configs/kona-perf_defconfig"
          )
          DEF_FILE=""
          for c in "${CANDIDATES[@]}"; do
            if [ -f "$c" ]; then
              DEF_FILE="$c"
              break
            fi
          done
          if [ -z "$DEF_FILE" ]; then
            echo "ERROR: no usable defconfig found for ${{ inputs.DEVICE }}" >&2
            echo "----- arch/arm64/configs/ -----"
            ls arch/arm64/configs/ || true
            echo "----- arch/arm64/configs/vendor/ -----"
            ls arch/arm64/configs/vendor/ || true
            exit 1
          fi
          echo "Using defconfig: $DEF_FILE"
          # Pass the file name (relative to arch/arm64/configs) to the build step
          DEF_REL="${DEF_FILE#arch/arm64/configs/}"
          echo "DEF_REL=$DEF_REL" >> $GITHUB_ENV

          {
            echo ""
            echo "# === ReSukiSU ==="
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_DEBUG=n"
            if [ "${{ inputs.HOOK_MODE }}" = "manual" ]; then
              echo "CONFIG_KSU_MANUAL_HOOK=y"
              echo "# CONFIG_KSU_KPROBES_HOOK is not set"
            else
              echo "CONFIG_KSU_SUSFS_SUS_SU=y"
            fi
          } >> "$DEF_FILE"

          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ]; then
            {
              echo ""
              echo "# === SUSFS ==="
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            } >> "$DEF_FILE"
          fi

          {
            echo ""
            echo "# === Local version ==="
            echo "CONFIG_LOCALVERSION=\"${{ inputs.KERNEL_LOCALVERSION }}\""
            echo "# CONFIG_LOCALVERSION_AUTO is not set"
          } >> "$DEF_FILE"

          echo "----- defconfig tail -----"
          tail -n 60 "$DEF_FILE"

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$GITHUB_WORKSPACE/tc/gcc64/bin:$GITHUB_WORKSPACE/tc/gcc32/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"

          make O=out ARCH=arm64 "${DEF_REL}"

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            READELF=llvm-readelf HOSTCXX="ccache clang++" \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1

          echo "----- Built kernel version string -----"
          strings out/arch/arm64/boot/Image.gz-dtb | grep -m1 "Linux version" || true
          ls -lh out/arch/arm64/boot/

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          cp "$GITHUB_WORKSPACE/workflow_repo/patches/op8/anykernel.sh" anykernel.sh

          cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          [ -f ../kernel/out/arch/arm64/boot/dtbo.img ] && cp ../kernel/out/arch/arm64/boot/dtbo.img .

          STAMP=$(date -u +%Y%m%d-%H%M)
          ZIP_NAME="AnyKernel3_${{ inputs.CUSTOM_TAG }}_${{ inputs.DEVICE }}_4.19.157${{ inputs.KERNEL_LOCALVERSION }}_${STAMP}.zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *.zip
          cd ..
          ls -lh "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Build boot.img
        run: |
          set -e
          KERNEL_OUT="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb"
          OUT_BOOT="boot.img"

          # Path A: stock boot.img provided -> repack via magiskboot from AK3
          STOCK=""
          if [ -n "${{ inputs.STOCK_BOOT_URL }}" ]; then
            echo "[+] Downloading stock boot.img from URL"
            curl -fL "${{ inputs.STOCK_BOOT_URL }}" -o stock_boot.img
            STOCK="stock_boot.img"
          elif [ -f "$GITHUB_WORKSPACE/workflow_repo/patches/op8/stock_boot.img" ]; then
            echo "[+] Using committed patches/op8/stock_boot.img"
            STOCK="$GITHUB_WORKSPACE/workflow_repo/patches/op8/stock_boot.img"
          fi

          if [ -n "$STOCK" ]; then
            cp "$STOCK" stock_boot.img
            cd ak3/tools
            chmod +x magiskboot
            ./magiskboot unpack "$GITHUB_WORKSPACE/stock_boot.img"
            cp "$KERNEL_OUT" kernel
            ./magiskboot repack "$GITHUB_WORKSPACE/stock_boot.img" "$GITHUB_WORKSPACE/$OUT_BOOT"
            cd "$GITHUB_WORKSPACE"
            echo "[+] boot.img repacked from stock template"
          else
            echo "[+] No stock boot.img provided, synthesizing via AOSP mkbootimg"
            git clone --depth=1 \
              https://android.googlesource.com/platform/system/tools/mkbootimg \
              /tmp/mkbootimg
            : > /tmp/empty_ramdisk
            # OP8 boot header v2 default offsets
            python3 /tmp/mkbootimg/mkbootimg.py \
              --kernel "$KERNEL_OUT" \
              --ramdisk /tmp/empty_ramdisk \
              --base 0x00000000 \
              --kernel_offset 0x00008000 \
              --ramdisk_offset 0x01000000 \
              --second_offset 0x00f00000 \
              --tags_offset 0x00000100 \
              --pagesize 4096 \
              --header_version 2 \
              --os_version 13.0.0 \
              --os_patch_level 2023-04 \
              --cmdline "console=ttyMSM0,115200n8 androidboot.console=ttyMSM0 printk.devkmsg=on androidboot.hardware=qcom androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=0 firmware_class.path=/vendor/firmware_mnt/image loop.max_part=7 cgroup.memory=nokmem,nosocket reboot=panic_warm" \
              -o "$OUT_BOOT"
            echo "[!] Synthesized boot.img: ramdisk is empty; flash via fastboot only on a device with --disable-verity --disable-verification."
          fi
          ls -lh "$OUT_BOOT"

          # rename for artifact
          STAMP=$(date -u +%Y%m%d-%H%M)
          BOOT_NAME="boot_${{ inputs.CUSTOM_TAG }}_${{ inputs.DEVICE }}_4.19.157${{ inputs.KERNEL_LOCALVERSION }}_${STAMP}.img"
          mv "$OUT_BOOT" "$BOOT_NAME"
          echo "BOOT_NAME=$BOOT_NAME" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-${{ inputs.DEVICE }}-4.19.157${{ inputs.KERNEL_LOCALVERSION }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.BOOT_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Print summary
        run: |
          echo "### Build summary"  >> $GITHUB_STEP_SUMMARY
          echo "Device:  ${{ inputs.DEVICE }} (IN2013 / EX01)"   >> $GITHUB_STEP_SUMMARY
          echo "Source:  ${{ inputs.SOURCE_REPO }}@${{ inputs.SOURCE_BRANCH }}" >> $GITHUB_STEP_SUMMARY
          echo "KSU:     ReSukiSU @ ${{ inputs.KSU_BRANCH }}"    >> $GITHUB_STEP_SUMMARY
          echo "Hook:    ${{ inputs.HOOK_MODE }}"                >> $GITHUB_STEP_SUMMARY
          echo "SUSFS:   ${{ inputs.ENABLE_SUSFS }}"             >> $GITHUB_STEP_SUMMARY
          echo "Kernel:  4.19.157${{ inputs.KERNEL_LOCALVERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "Output:  ${{ env.ZIP_NAME }} + ${{ env.BOOT_NAME }}" >> $GITHUB_STEP_SUMMARY
